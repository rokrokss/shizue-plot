<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .canvas { width: 1280px; height: 800px; }
  .top { position: absolute; left: 80px; top: 56px; right: 80px; }
  .headline { font-size: 60px; margin-top: 22px; }
  .sub { margin-top: 16px; max-width: 900px; }
  .chips { margin-top: 20px; }
  .w1 { left: 110px; top: 330px; width: 1060px; }
</style>
</head>
<body>
<div class="canvas cream">
  <div class="top">
    <span class="eyebrow"><span class="dot"></span>Import</span>
    <h1 class="headline">Import from <span class="m">RisuRealm</span> in one paste</h1>
    <p class="sub">Paste a character page address and the whole card comes in: art, lorebook, scripts and assets.</p>
    <div class="chips">
      <span class="chip"><i></i>RisuRealm</span>
      <span class="chip"><i></i>.png · .charx · .json cards</span>
      <span class="chip"><i></i>.risum modules</span>
      <span class="chip"><i></i>RisuAI chats</span>
      <span class="chip"><i></i>SillyTavern folders</span>
    </div>
  </div>
  <div class="window w1">
    <div class="bar"><i></i><i></i><i></i><span class="url">localhost:13000/plots</span></div>
    <img class="shot" src="../shots/realm.png" alt="">
  </div>
</div>
</body>
</html>
